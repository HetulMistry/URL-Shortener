<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>URL Shortener — Backend</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --border: #e2e8f0;
      }

      [data-theme="dark"] {
        --bg: #0b1220;
        --card: #071122;
        --text: #e6eef0;
        --muted: #94a3b8;
        --accent: #6ea8ff;
        --border: #122036;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
      }

      body {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        padding: 24px;
      }

      .card {
        max-width: 850px;
        margin: 24px auto;
        padding: 24px;
        border-radius: 14px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      h1 {
        margin: 0;
      }

      .lead {
        color: var(--muted);
        margin-top: 8px;
      }

      dl {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 10px 12px;
        margin-top: 24px;
      }

      dt {
        font-weight: 600;
        color: var(--text);
      }

      dd {
        margin: 0;
        color: var(--muted);
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .toggle {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }

      .status-healthy {
        color: #16a34a;
        font-weight: 600;
      }

      .status-unhealthy {
        color: #dc2626;
        font-weight: 600;
      }

      footer {
        margin-top: 24px;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="header">
        <div>
          <h1>URL Shortener — Backend</h1>
          <p class="lead">
            Service is running. Useful links and runtime status below.
          </p>
        </div>

        <button id="themeToggle" class="toggle" aria-pressed="false">
          🌙 Dark
        </button>
      </div>

      <dl>
        <dt>Status</dt>
        <dd id="status">Loading...</dd>

        <dt>Database</dt>
        <dd id="database">—</dd>

        <dt>Redis</dt>
        <dd id="redis">—</dd>

        <dt>Uptime</dt>
        <dd id="uptime">—</dd>
      </dl>

      <p style="margin-top: 18px">
        <a href="/api/v1/docs">API Documentation</a>
        &nbsp;•&nbsp;
        <a href="/health">Health Endpoint</a>
      </p>

      <footer>Backend status dashboard for the URL Shortener service.</footer>
    </div>

    <script src="/js/app.js" defer></script>
  </body>
</html>
